<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" fill="none">
  <defs>
    <linearGradient id="wm-cyanGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#67e8f9" />
      <stop offset="55%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wm-arcTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="wm-arcBot" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <radialGradient id="wm-radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#010614" stop-opacity="0" />
    </radialGradient>
    <filter id="wm-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="wm-intense" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur2" />
      <feGaussianBlur stdDeviation="1.2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: The Signal Emblem (Scaled & translated to x=10, y=10, 76x76) -->
  <g transform="translate(10, 10) scale(0.76)">
    <!-- Base Plate -->
    <rect width="94" height="94" x="3" y="3" rx="22" fill="#010714" stroke="#0a335c" stroke-width="1.6" />
    
    <!-- Concentric Reference Rings -->
    <circle cx="50" cy="50" r="39" stroke="#062548" stroke-width="1" stroke-dasharray="2 4" opacity="0.7" />
    <circle cx="50" cy="50" r="28" stroke="#073260" stroke-width="0.8" opacity="0.6" />
    <circle cx="50" cy="50" r="15" stroke="#0b4682" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.5" />

    <!-- Ambient Glow -->
    <circle cx="50" cy="50" r="30" fill="url(#wm-radialGlow)" />

    <!-- Outer Reticles -->
    <path d="M 11 23 L 11 11 L 23 11" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 77 11 L 89 11 L 89 23" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 11 77 L 11 89 L 23 89" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 77 89 L 89 89 L 89 77" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Cardinal Ticks -->
    <line x1="50" y1="4" x2="50" y2="10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="90" x2="50" y2="96" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="4" y1="50" x2="10" y2="50" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
    <line x1="90" y1="50" x2="96" y2="50" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />

    <!-- Radiating Acoustic Sonar Wavefronts (Echo Pulse Top-Right) -->
    <path d="M 64 22 C 72 26 78 32 81 40" stroke="url(#wm-arcTop)" stroke-width="2.6" stroke-linecap="round" filter="url(#wm-glow)" />
    <path d="M 72 15 C 83 21 91 30 94 41" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

    <!-- Radiating Acoustic Sonar Wavefronts (Echo Pulse Bottom-Left) -->
    <path d="M 36 78 C 28 74 22 68 19 60" stroke="url(#wm-arcBot)" stroke-width="2.6" stroke-linecap="round" filter="url(#wm-glow)" />
    <path d="M 28 85 C 17 79 9 70 6 59" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round" opacity="0.75" />

    <!-- THE SIGNAL "S" EMBLEM -->
    <path d="M 32 32 C 32 20 42 16 54 16 C 66 16 75 22 75 32 C 75 42 67 46 56 49 L 44 53 C 33 56 25 60 25 70 C 25 80 34 86 46 86 C 58 86 68 80 68 68" 
          stroke="url(#wm-cyanGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#wm-intense)" />
    
    <!-- Neon Trace -->
    <path d="M 33 32 C 33 22 43 18.5 54 18.5 C 64 18.5 72 23.5 72 32 C 72 40 65 43.5 54 46.5 L 46 49.5 C 35 52.5 28 56 28 66 C 28 77 36 82.5 46 82.5 C 57 82.5 65 77.5 65 68" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- Central Beacon Core -->
    <circle cx="50" cy="50" r="5.2" fill="#ffffff" filter="url(#wm-intense)" />
    <circle cx="50" cy="50" r="2.2" fill="#011024" />
  </g>

  <!-- Right: Typography Wordmark Lockup -->
  <g transform="translate(104, 0)">
    <!-- Primary Title: THE SIGNAL -->
    <text x="0" y="48" font-family="'Quantico', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="0.14em" fill="#ffffff">
      THE SIGNAL
    </text>
    
    <!-- Year Tag: // '26 -->
    <text x="248" y="48" font-family="'Quantico', monospace" font-weight="700" font-size="24" letter-spacing="0.08em" fill="#22d3ee">
      // &apos;26
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="2" y="72" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11.5" letter-spacing="0.22em" fill="#38bdf8" opacity="0.85">
      DEEP-SEA HACKATHON // IEEE UCSC
    </text>
  </g>
</svg>